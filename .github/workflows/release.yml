name: Release

# Push a tag such as v0.2.0 to build the macOS .dmg and the Android .apk and publish them as a GitHub
# release. Run it by hand (workflow_dispatch) to get the files as workflow artifacts without releasing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The ScreenCaptureKit bindings need the macOS 26 SDK, which ships with Xcode 26.
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Build the app and the disk image
        run: ./tools/dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.LIGARVIEW_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then echo "LIGARVIEW_KEYSTORE_BASE64 is not set"; exit 1; fi
            echo "No release key: the APK will be signed with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "LIGARVIEW_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build the APK
        env:
          LIGARVIEW_KEYSTORE_PASSWORD: ${{ secrets.LIGARVIEW_KEYSTORE_PASSWORD }}
          LIGARVIEW_KEY_ALIAS: ${{ secrets.LIGARVIEW_KEY_ALIAS }}
          LIGARVIEW_KEY_PASSWORD: ${{ secrets.LIGARVIEW_KEY_PASSWORD }}
        run: ./tools/apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  release:
    if: github.ref_type == 'tag'
    needs: [macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match the versions in the code
        run: |
          tag="${GITHUB_REF_NAME#v}"
          host=$(sed -n 's/^version = "\(.*\)"/\1/p' host/Cargo.toml | head -1)
          app=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts | head -1)
          echo "tag=$tag host=$host app=$app"
          [ "$tag" = "$host" ] && [ "$tag" = "$app" ]
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release notes are this version's section of CHANGELOG.md; without one, GitHub writes them.
          tag="${GITHUB_REF_NAME#v}"
          awk -v tag="$tag" '/^## \[/ { found = index($0, "[" tag "]") > 0; next } found' CHANGELOG.md > notes.md
          notes=--generate-notes
          if [ -s notes.md ]; then notes="--notes-file ../notes.md"; fi
          cd dist
          shasum -a 256 * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Ligarview $GITHUB_REF_NAME" $notes *
